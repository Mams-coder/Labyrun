<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevRun - Apprendre le code</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Ton CSS d'origine pour les touches tactiles */
        .d-pad {
            width: 60px;
            height: 60px;
            font-size: 24px;
            background-color: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .d-pad:active {
            background-color: #059669;
            transform: scale(0.95);
        }
    </style>
</head>

<body class="bg-gray-950 text-white font-sans select-none overflow-hidden touch-manipulation">

    <div id="screen-selection" class="min-h-screen flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-8 drop-shadow-lg text-center">
            DevRun
        </h1>
        <p class="mb-8 text-gray-400 text-lg text-center">Choisis ta spécialité pour pirater le système :</p>
        
        <div class="flex flex-col sm:flex-row gap-4">
            <button onclick="startGame('JavaScript')" class="px-8 py-4 bg-gray-800 border border-gray-700 rounded-xl hover:bg-yellow-500 hover:text-black font-bold transition-all text-xl">JavaScript</button>
            <button onclick="startGame('Python')" class="px-8 py-4 bg-gray-800 border border-gray-700 rounded-xl hover:bg-blue-500 hover:text-white font-bold transition-all text-xl">Python</button>
            <button onclick="startGame('C')" class="px-8 py-4 bg-gray-800 border border-gray-700 rounded-xl hover:bg-red-500 hover:text-white font-bold transition-all text-xl">C / Embarqué</button>
        </div>
    </div>

    <div id="screen-game" class="hidden min-h-screen flex-col items-center justify-center p-4">
        
        <div class="text-center mb-2">
            <h1 id="gameTitle" class="text-2xl font-black text-emerald-500 tracking-widest uppercase">Spécialité</h1>
            <div id="levelDisplay" class="text-gray-400 font-mono mt-1">Niveau 1</div>
        </div>

        <div class="mb-4 flex items-center gap-3 bg-gray-900 px-4 py-2 rounded-full border border-gray-800">
            <label for="colorPicker" class="text-sm font-bold">🎨 Couleur :</label>
            <input type="color" id="colorPicker" value="#059669" class="w-6 h-6 rounded cursor-pointer bg-transparent border-none">
        </div>

        <div class="p-1 rounded-xl bg-gradient-to-br from-gray-800 to-gray-900 shadow-xl mb-4">
            <canvas id="gameCanvas" class="block rounded-lg shadow-inner bg-black"></canvas>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <div></div>
            <button id="btnUp" class="d-pad">⬆️</button>
            <div></div>
            <button id="btnLeft" class="d-pad">⬅️</button>
            <button id="btnDown" class="d-pad">⬇️</button>
            <button id="btnRight" class="d-pad">➡️</button>
        </div>
    </div>

    <div id="quizModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border-2 border-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] p-6 md:p-8 rounded-xl max-w-lg w-full relative overflow-hidden">
            
            <div class="absolute inset-0 bg-[linear-gradient(transparent_50%,rgba(0,0,0,0.4)_50%)] bg-[length:100%_4px] pointer-events-none opacity-30"></div>
            
            <h2 id="quizLang" class="text-emerald-400 font-bold text-sm tracking-widest uppercase mb-4 relative z-10">
                🔒 PARE-FEU : ANALYSE EN COURS...
            </h2>
            
            <p id="quizQuestion" class="text-white text-lg md:text-xl mb-8 font-mono relative z-10 leading-relaxed">
                Chargement...
            </p>
            
            <div id="quizOptions" class="flex flex-col gap-3 relative z-10 font-mono">
            </div>
            
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

</body>
</html>
