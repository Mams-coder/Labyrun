<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyMaze Web</title>
    <style>
        body { 
            background-color: #2c3e50; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        canvas { 
            background-color: #ecf0f1; 
            border: 4px solid #34495e; 
            margin-top: 20px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>PyMaze Web</h1>
    <p>Utilise les flèches pour atteindre la sortie (Carré Rouge)</p>
    <canvas id="gameCanvas" width="420" height="420"></canvas>
    <br>
    <button onclick="initGame()">Nouvelle Partie</button>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
