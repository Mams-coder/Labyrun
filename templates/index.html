<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabyRun</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .row {
            display: flex;
            gap: 5px;
        }

        .d-pad {
            width: 60px;
            height: 60px;
            font-size: 24px;
            background-color: #34495e;
            /* Couleur sombre */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;

            /* Empêche le zoom sur mobile quand on tape vite */
            touch-action: manipulation;
            user-select: none;
        }

        .d-pad:active {
            background-color: #2980b9;
            /* Change de couleur quand on appuie */
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <h1>PyMaze Web</h1>
    <p>Utilise les flèches pour atteindre la sortie (Carré Rouge)</p>
    <canvas id="gameCanvas" width="420" height="420"></canvas>
    <div id="controls">
        <div class="row">
            <button id="btnUp" class="d-pad">⬆️</button>
        </div>
        <div class="row">
            <button id="btnLeft" class="d-pad">⬅️</button>
            <button id="btnDown" class="d-pad">⬇️</button>
            <button id="btnRight" class="d-pad">➡️</button>
        </div>
    </div>
    <br>
    <button onclick="initGame()">Nouvelle Partie</button>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>

</html>
